# Keeps the `self-hosted` branch on top of upstream's latest published release.
# Checks hourly from the repository cron `self-hosted-sync` on branch
# `self-hosted`, schedule `37 * * * *`.
#
# When the release changes, the fork's patches are rebased onto it and pushed
# back, which starts self-hosted-build.yaml. Unreleased upstream commits do not
# trigger builds. An unchanged release ends the run without pushing. A failed
# rebase pushes nothing, so CPA keeps serving the last published panel, and
# reports the failure to T3 Code, which starts an agent run to repair the
# branch. The push is leased on the commit this run started from, so a patch
# pushed meanwhile is never overwritten.
#
# Pushes as the `whexy-bot` GitHub App through the secrets `github_app_id`,
# `github_app_installation_id`, and `github_app_private_key`. Reports through
# the secret `t3_repair_webhook`, a T3 Code scheduled task's webhook URL.
when:
  event: cron

# The rebase needs the branch's history back to its upstream merge base.
clone:
  - name: git
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 0

steps:
  - name: rebase
    image: node:24
    environment:
      GITHUB_APP_ID:
        from_secret: github_app_id
      GITHUB_APP_INSTALLATION_ID:
        from_secret: github_app_installation_id
      GITHUB_APP_PRIVATE_KEY:
        from_secret: github_app_private_key
    commands:
      - release_tag="$(node scripts/self-hosted/stable-release.mjs)"
      - mkdir -p .sync && printf '%s' "$release_tag" > .sync/release-tag
      - git fetch --no-tags https://github.com/router-for-me/Cli-Proxy-API-Management-Center.git +refs/heads/main:refs/remotes/upstream/main "+refs/tags/$release_tag:refs/remotes/upstream/stable"
      - release_sha="$(git rev-parse 'refs/remotes/upstream/stable^{commit}')"
      - upstream_base="$(git merge-base HEAD refs/remotes/upstream/main)"
      - |
        if [ "$upstream_base" = "$release_sha" ]; then
          echo "self-hosted already follows $release_tag."
          exit 0
        fi
      - git config user.name "whexy-bot[bot]"
      - git config user.email "315421218+whexy-bot[bot]@users.noreply.github.com"
      - git rebase --onto "$release_sha" "$upstream_base"
      - token="$(node scripts/self-hosted/github-app.mjs)"
      - git push --force-with-lease="self-hosted:$CI_COMMIT_SHA" "https://x-access-token:$token@github.com/${CI_REPO}.git" HEAD:self-hosted

  - name: report-failure
    image: node:24
    when:
      status: failure
    environment:
      T3_REPAIR_WEBHOOK:
        from_secret: t3_repair_webhook
    commands:
      # A conflict stops the rebase before the fork's later commits, this script's among them.
      - git rebase --abort 2>/dev/null || true
      - node scripts/self-hosted/report-failure.mjs sync
